[pytest]
testpaths = tests
# Los módulos se importan como paquete (from services.pipeline import ...,
# from routers import eventos). Sin esto, pytest corre desde tests/ y no
# encuentra ni la raíz del backend ni sql/services/routers.
pythonpath = .
asyncio_mode = auto
# Silencia el warning de pytest-asyncio sobre el scope por defecto del loop.
asyncio_default_fixture_loop_scope = function
